<header class="header">
  <button
    type="button"
    class="menu-button"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
    (click)="menuToggle.emit()"
  >
    <span class="menu-icon" aria-hidden="true"></span>
  </button>
  <a class="brand" routerLink="/">{{ appName() }}</a>
  <div class="actions">
    <!-- Phase 5: theme toggle, language switcher -->
    @if (user(); as u) {
      <span class="user" title="{{ u.email }}">{{ u.name }}</span>
      <button type="button" class="sign-out" (click)="logout()">Sign out</button>
    }
  </div>
</header>
