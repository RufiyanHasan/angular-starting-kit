<header class="header">
  <button
    appButton
    type="button"
    variant="ghost"
    size="icon"
    class="menu-button"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="(menuOpen() ? 'nav.close' : 'nav.open') | transloco"
    (click)="menuToggle.emit()"
  >
    <span class="menu-icon" aria-hidden="true"></span>
  </button>
  <a class="brand" routerLink="/">{{ appName() }}</a>
  <div class="actions">
    <app-language-select class="language" />
    <app-theme-toggle />
    @if (user(); as u) {
      <span class="user" title="{{ u.email }}">{{ u.name }}</span>
      <button appButton type="button" size="sm" (click)="logout()">
        {{ 'header.signOut' | transloco }}
      </button>
    }
  </div>
</header>
