name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage gate ≥ 80% on core/)
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: angular-starter-kit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 angular-starter-kit:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          # App shell, SPA fallback for deep links, runtime config, real 404 for missing assets
          curl -fsS http://localhost:8080/ | grep -q '<app-root>'
          curl -fsS http://localhost:8080/users/u-001 | grep -q '<app-root>'
          curl -fsS http://localhost:8080/assets/config.json | grep -q '"apiBaseUrl"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.json)" = 404
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          docker logs app

  # Live demo: the static build on GitHub Pages (mock API + mock auth, so no backend needed).
  # Runs only for pushes to main, after the checks pass. Pages can't set custom headers or
  # run the Docker image; real environments should use the image instead.
  deploy-pages:
    name: Deploy demo to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Project pages are served from /<repo-name>/, not the domain root.
      - name: Build for the Pages subpath
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages has no SPA fallback: serving index.html as 404.html makes deep links and reloads work.
      - name: Add SPA fallback
        run: cp dist/angular-starter-kit/browser/index.html dist/angular-starter-kit/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-starter-kit/browser

      - id: deployment
        uses: actions/deploy-pages@v4
