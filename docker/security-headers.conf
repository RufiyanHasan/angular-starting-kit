# Included in every location: nginx drops inherited add_header directives as soon as a
# location defines its own, so headers live here instead of at server level.
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Enable HSTS only when the site is served exclusively over HTTPS (usually at the load balancer):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
